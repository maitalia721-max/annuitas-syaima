<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annuity Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: right;
        }
        th {
            background-color: #eee;
            text-align: center;
        }
        td:first-child {
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Annuity Calculator</h1>
    <h2>Hitung Angsuran Anuitas</h2>

    <form id="annuityForm">
        <div class="form-group">
            <label for="principal">Jumlah Pinjaman (Rp):</label>
            <input type="number" id="principal" required>
        </div>

        <div class="form-group">
            <label for="rate">Suku Bunga per Tahun (%):</label>
            <input type="number" step="0.01" id="rate" required>
        </div>

        <div class="form-group">
            <label for="periods">Jangka Waktu (Bulan):</label>
            <input type="number" id="periods" required>
        </div>

        <button type="submit">Hitung</button>
    </form>

    <h2>Hasil Perhitungan</h2>
    <table>
        <thead>
            <tr>
                <th>Bulan</th>
                <th>Angsuran Pokok (Rp)</th>
                <th>Angsuran Bunga (Rp)</th>
                <th>Total Anuitas (Rp)</th>
                <th>Sisa Saldo (Rp)</th>
            </tr>
        </thead>
        <tbody id="resultBody">
            <!-- Hasil hitungan akan muncul di sini -->
        </tbody>
    </table>

    <script>
        document.getElementById('annuityForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const principal = parseFloat(document.getElementById('principal').value);
            const annualRate = parseFloat(document.getElementById('rate').value);
            const months = parseInt(document.getElementById('periods').value);

            const monthlyRate = (annualRate / 100) / 12;
            const annuity = (principal * monthlyRate) / (1 - Math.pow(1 + monthlyRate, -months));

            let balance = principal;
            const resultBody = document.getElementById('resultBody');
            resultBody.innerHTML = '';

            for (let i = 1; i <= months; i++) {
                const interestPayment = balance * monthlyRate;
                const principalPayment = annuity - interestPayment;
                balance -= principalPayment;

                const remainingBalance = balance < 0 ? 0 : balance;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${i}</td>
                    <td>${principalPayment.toLocaleString('id-ID', {maximumFractionDigits: 2})}</td>
                    <td>${interestPayment.toLocaleString('id-ID', {maximumFractionDigits: 2})}</td>
                    <td>${annuity.toLocaleString('id-ID', {maximumFractionDigits: 2})}</td>
                    <td>${remainingBalance.toLocaleString('id-ID', {maximumFractionDigits: 2})}</td>
                `;
                resultBody.appendChild(row);
            }
        });
    </script>
</body>
</html>
